# Replace LAST_LIGHT_BACKEND_HOST with the deployment hostname.
limit_req_zone $binary_remote_addr zone=lastlight_backend:10m rate=30r/s;
server {
    listen 80;
    listen [::]:80;
    server_name LAST_LIGHT_BACKEND_HOST;
    location /.well-known/acme-challenge/ { root /var/www/lastlight-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name LAST_LIGHT_BACKEND_HOST;
    ssl_certificate /etc/letsencrypt/live/LAST_LIGHT_BACKEND_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/LAST_LIGHT_BACKEND_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    location / {
        limit_req zone=lastlight_backend burst=100 nodelay;
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
