[package]
name = "last-light"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy"] }
near-sys = "=0.2.5"
borsh = "1.5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[features]
default = []
unit-testing = ["near-sdk/unit-testing"]
model-testing = ["near-sdk/non-contract-usage"]

[[bin]]
name = "trace"
path = "src/trace.rs"
required-features = ["model-testing"]
